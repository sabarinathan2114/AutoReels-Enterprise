version: '3.8'

services:
  # MySQL 8.0 Primary Relational Database
  mysql:
    image: mysql:8.0
    container_name: autoreels_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: autoreels_db
      MYSQL_USER: autoreels
      MYSQL_PASSWORD: autoreelspassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis In-Memory Cache, Rate Limiting & Queue
  redis:
    image: redis:7.2-alpine
    container_name: autoreels_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO S3-Compatible Storage
  minio:
    image: minio/minio:latest
    container_name: autoreels_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Mailpit Local Development SMTP & Web Inbox
  mailpit:
    image: axllent/mailpit:latest
    container_name: autoreels_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 3

  # AutoReels FastAPI Backend API
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: autoreels_api
    restart: unless-stopped
    environment:
      ENV: development
      DEBUG: "true"
      DATABASE_URL: mysql+pymysql://autoreels:autoreelspassword@mysql:3306/autoreels_db
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      MINIO_ENDPOINT: minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # AutoReels Async Worker (Pipeline Rendering)
  worker:
    build:
      context: ../workers
      dockerfile: Dockerfile
    container_name: autoreels_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://autoreels:autoreelspassword@mysql:3306/autoreels_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../storage:/app/storage

  # Next.js 16 Responsive Frontend (Obsidian/Cosmic Violet Theme)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: autoreels_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  mysql_data:
  redis_data:
  minio_data:
